packages:
  - "packages/*"
  - "editors/nvim"
  - "editors/vscode"
  - "editors/zed"
  - "examples/*"
  - "homepage"
allowBuilds:
  unrs-resolver: true
  esbuild: true
  tree-sitter-cli: true
  '@vscode/vsce-sign': true
  keytar: true
  '@typerighter/rpc-server': true
overrides:
  postcss: ">=8.5.26"
  browserslist: ">=4.28.8"
  nanoid: ">=3.3.18"
  qs: ">=6.16.0"
  brace-expansion@1: "1.1.18"
  brace-expansion@5: "5.0.9"
minimumReleaseAgeExclude:
  - '@typerighter/rpc-client@0.1.6'
  - '@typerighter/rpc-server@0.1.6'
  - typerighter@0.1.6
  - '@lucide/vue@1.39.0'
  - '@types/node@26.4.1'
  - '@hdnax/nuclint@0.17.5'
