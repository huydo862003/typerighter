packages:
  - "packages/*"
  - "editors/nvim"
  - "editors/vscode"
  - "editors/zed"
  - "examples/*"
  - "!examples/huydo862003.github.io"
  - "packages/typerighter/e2e/fixtures/*"
  - "homepage"
allowBuilds:
  unrs-resolver: true
  esbuild: true
  tree-sitter-cli: true
  '@vscode/vsce-sign': true
  keytar: true
  '@typerighter/rpc-server': true
overrides:
  postcss: ">=8.5.26"
  browserslist: ">=4.28.8"
  nanoid: ">=3.3.18"
  qs: ">=6.16.0"
  brace-expansion@1: "1.1.18"
  brace-expansion@5: "5.0.9"
  serialize-javascript: "^7.1.3"
  mocha: "^12.0.3"
minimumReleaseAgeExclude:
  - "@typerighter/rpc-client"
  - "@typerighter/rpc-server"
  - typerighter
  - '@lucide/vue@1.39.0'
  - '@types/node@26.4.1'
  - "@hdnax/nuclint@0.17.5 || 0.18.1"
