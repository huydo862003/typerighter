packages:
  - "packages/*"
  - "editors/nvim"
  - "editors/vscode"
  - "editors/zed"
  - "examples/*"
  - "homepage"
allowBuilds:
  unrs-resolver: true
  esbuild: true
  tree-sitter-cli: true
  '@vscode/vsce-sign': true
  keytar: true
  '@typerighter/rpc-server': true
minimumReleaseAgeExclude:
  - '@typerighter/rpc-client@0.1.6'
  - '@typerighter/rpc-server@0.1.6'
  - typerighter@0.1.6
  - '@lucide/vue@1.39.0'
  - '@types/node@26.4.1'
