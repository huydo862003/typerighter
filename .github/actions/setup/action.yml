name: Setup Toolchain
description: Install Rust, Node, and pnpm with caching

inputs:
  rust:
    description: Install Rust toolchain
    default: 'true'
  node:
    description: Install Node, pnpm, and dependencies
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install Rust
      if: inputs.rust == 'true'
      uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
      with:
        toolchain: stable

    - name: Cache Rust dependencies
      if: inputs.rust == 'true'
      uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.3

    - name: Install pnpm
      if: inputs.node == 'true'
      uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

    - name: Setup Node
      if: inputs.node == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'
        cache: pnpm

    - name: Install dependencies
      if: inputs.node == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
