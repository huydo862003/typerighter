name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup

      - name: Build Rust
        run: cargo build --locked -p typedown-server

      - name: Build packages
        run: |
          pnpm --filter @typerighter/rpc-client build
          pnpm --filter typerighter build

      - name: Install Playwright browsers
        run: pnpm --filter typerighter exec playwright install chromium

      - name: Run E2E tests
        run: pnpm --filter typerighter e2e --reporter=github

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            packages/typerighter/test-results/
            packages/typerighter/playwright-report/
          retention-days: 7
