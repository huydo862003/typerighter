name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-versions:
    name: Verify Versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable

      - name: Check version consistency
        run: |
          VERSION=$(cat VERSION)

          # Cargo workspace version
          CARGO_VERSION=$(cargo pkgid typedown-server | sed 's/.*#//')
          if [[ "$CARGO_VERSION" != "$VERSION" ]]; then
            echo "Cargo.toml version '$CARGO_VERSION' does not match VERSION '$VERSION'"
            exit 1
          fi

          # package.json versions
          while IFS= read -r PKG_JSON; do
            PKG_VERSION=$(pnpm --dir "$(dirname "$PKG_JSON")" pkg get version | tr -d '"')
            if [[ "$PKG_VERSION" != "$VERSION" ]]; then
              echo "$PKG_JSON version '$PKG_VERSION' does not match VERSION '$VERSION'"
              exit 1
            fi
          done < <(find . -name package.json -not -path '*/node_modules/*' -not -path '*/examples/*' -not -path '*/e2e/fixtures/*')

          # CHANGELOG.md latest version
          CHANGELOG_VERSION=$(grep -m1 '^## \[' CHANGELOG.md | sed 's/## \[\(.*\)\].*/\1/' || true)
          if [[ -n "$CHANGELOG_VERSION" && "$CHANGELOG_VERSION" != "$VERSION" ]]; then
            echo "CHANGELOG.md latest version '$CHANGELOG_VERSION' does not match VERSION '$VERSION'"
            exit 1
          fi

          echo "All versions consistent: $VERSION"

  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup
        with:
          node: 'false'

      - name: Test
        run: cargo test --locked --workspace --exclude typedown-zed

      - name: Upload LSP binary
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lsp-binary
          path: target/debug/typedown-server
          retention-days: 1

  tree-sitter:
    name: Tree-sitter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup
        with:
          rust: 'false'

      - name: Generate and test
        working-directory: packages/tree-sitter
        run: |
          pnpm run generate
          pnpm run test

  neovim-tests:
    name: Neovim LSP Tests
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup
        with:
          rust: 'false'

      - name: Download LSP binary
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: lsp-binary
          path: target/debug

      - name: Make binary executable
        run: chmod +x target/debug/typedown-server

      - name: Build tree-sitter parsers
        working-directory: packages/tree-sitter
        run: |
          pnpm run generate
          pnpm run build:so

      - name: Install Neovim
        uses: rhysd/action-setup-vim@8e931b9954b19d4203d5caa5ff5521f3bc21dcc7 # v1.4.2
        with:
          neovim: true
          version: stable

      - name: Run Neovim tests
        working-directory: editors/nvim
        run: bash tests/run.sh

  vscode-tests:
    name: VSCode Extension Tests
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup
        with:
          rust: 'false'

      - name: Download LSP binary
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: lsp-binary
          path: target/debug

      - name: Make binary executable and setup
        working-directory: editors/vscode
        run: |
          chmod +x ../../target/debug/typedown-server
          TYPEDOWN_BINARY_SOURCE=local node scripts/setup-binary.mjs

      - name: Build extension
        working-directory: editors/vscode
        run: pnpm run build

      - name: Run VSCode tests
        working-directory: editors/vscode
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a pnpm run test 2>&1 | grep -v "dbus\|object_proxy\|NameHasOwner\|Unknown address type\|Unknown channel:\|agentHostClient\|GL_RENDERER\|GL_VERSION\|GL_SHADING_LANGUAGE_VERSION\|\[ERROR:gl_surface"

  build-zed:
    name: Build Zed Extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup
        with:
          node: 'false'

      - run: rustup target add wasm32-wasip1

      - name: Build
        run: cargo build --locked -p typedown-zed --target wasm32-wasip1
