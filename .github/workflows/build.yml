name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-versions:
    name: Verify Versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable

      - name: Check version consistency
        run: |
          VERSION=$(cat VERSION)

          # Cargo workspace version
          CARGO_VERSION=$(cargo pkgid typedown-server | sed 's/.*#//')
          if [[ "$CARGO_VERSION" != "$VERSION" ]]; then
            echo "Cargo.toml version '$CARGO_VERSION' does not match VERSION '$VERSION'"
            exit 1
          fi

          # package.json versions
          while IFS= read -r PKG_JSON; do
            PKG_VERSION=$(pnpm --dir "$(dirname "$PKG_JSON")" pkg get version | tr -d '"')
            if [[ "$PKG_VERSION" != "$VERSION" ]]; then
              echo "$PKG_JSON version '$PKG_VERSION' does not match VERSION '$VERSION'"
              exit 1
            fi
          done < <(find . -name package.json -not -path '*/node_modules/*' -not -path '*/examples/*')

          # CHANGELOG.md latest version
          CHANGELOG_VERSION=$(grep -m1 '^## \[' CHANGELOG.md | sed 's/## \[\(.*\)\].*/\1/' || true)
          if [[ -n "$CHANGELOG_VERSION" && "$CHANGELOG_VERSION" != "$VERSION" ]]; then
            echo "CHANGELOG.md latest version '$CHANGELOG_VERSION' does not match VERSION '$VERSION'"
            exit 1
          fi

          echo "All versions consistent: $VERSION"

  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.3

      - name: Test
        run: cargo test --locked --workspace --exclude typedown-zed

  tree-sitter:
    name: Tree-sitter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate and test
        working-directory: packages/tree-sitter
        run: |
          pnpm run generate
          pnpm run test

  build-zed:
    name: Build Zed Extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable

      - name: Add wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.3

      - name: Build
        run: cargo build --locked -p typedown-zed --target wasm32-wasip1
