name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 */3 * *'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-current:
    name: Benchmark (current)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - uses: ./.github/actions/setup

      - name: Run benchmark
        id: bench
        run: bash .github/scripts/benchmark.sh

      - name: Save results
        run: |
          jq -n \
            --arg lib_build_s "${{ steps.bench.outputs.lib_build_s }}" \
            --arg binary_kb "${{ steps.bench.outputs.binary_kb }}" \
            --arg binary_stripped_kb "${{ steps.bench.outputs.binary_stripped_kb }}" \
            --arg install_kb "${{ steps.bench.outputs.install_kb }}" \
            --arg ssg_build_s "${{ steps.bench.outputs.ssg_build_s }}" \
            --arg ssg_ms_per_page "${{ steps.bench.outputs.ssg_ms_per_page }}" \
            --arg total_size_kb "${{ steps.bench.outputs.total_size_kb }}" \
            --arg js_kb "${{ steps.bench.outputs.js_kb }}" \
            --arg js_gz_kb "${{ steps.bench.outputs.js_gz_kb }}" \
            --arg css_kb "${{ steps.bench.outputs.css_kb }}" \
            --arg css_gz_kb "${{ steps.bench.outputs.css_gz_kb }}" \
            --arg html_kb "${{ steps.bench.outputs.html_kb }}" \
            --arg pages "${{ steps.bench.outputs.pages }}" \
            --arg commit "${{ github.sha }}" \
            '$ARGS.named' > /tmp/benchmark-current.json

      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-current
          path: /tmp/benchmark-current.json
          retention-days: 1

  benchmark-main:
    name: Benchmark (main)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          submodules: true

      - uses: ./.github/actions/setup

      - name: Run benchmark
        id: bench
        run: bash .github/scripts/benchmark.sh

      - name: Save results
        run: |
          jq -n \
            --arg lib_build_s "${{ steps.bench.outputs.lib_build_s }}" \
            --arg binary_kb "${{ steps.bench.outputs.binary_kb }}" \
            --arg binary_stripped_kb "${{ steps.bench.outputs.binary_stripped_kb }}" \
            --arg install_kb "${{ steps.bench.outputs.install_kb }}" \
            --arg ssg_build_s "${{ steps.bench.outputs.ssg_build_s }}" \
            --arg ssg_ms_per_page "${{ steps.bench.outputs.ssg_ms_per_page }}" \
            --arg total_size_kb "${{ steps.bench.outputs.total_size_kb }}" \
            --arg js_kb "${{ steps.bench.outputs.js_kb }}" \
            --arg js_gz_kb "${{ steps.bench.outputs.js_gz_kb }}" \
            --arg css_kb "${{ steps.bench.outputs.css_kb }}" \
            --arg css_gz_kb "${{ steps.bench.outputs.css_gz_kb }}" \
            --arg html_kb "${{ steps.bench.outputs.html_kb }}" \
            --arg pages "${{ steps.bench.outputs.pages }}" \
            --arg commit "${{ github.event.pull_request.base.sha }}" \
            '$ARGS.named' > /tmp/benchmark-main.json

      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-main
          path: /tmp/benchmark-main.json
          retention-days: 1

  comment:
    name: Post Results
    if: github.event_name == 'pull_request'
    needs: [benchmark-current, benchmark-main]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download results
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: results

      - name: Comment on PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const run = require('./.github/scripts/benchmark-comment.js');
            await run({ github, context, core });

  badges:
    name: Update Badges
    if: github.event_name == 'push' || github.event_name == 'schedule'
    needs: [benchmark-current]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download results
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: benchmark-current
          path: results

      - name: Generate badge JSON files
        run: |
          mkdir -p .github/badges
          DATA=$(cat results/benchmark-current.json)

          make_badge() {
            local label="$1" value="$2" color="${3:-blue}"
            jq -n --arg l "$label" --arg m "$value" --arg c "$color" \
              '{schemaVersion: 1, label: $l, message: $m, color: $c}'
          }

          # Total size = stripped binary + JS gzip
          BINARY_KB=$(echo "$DATA" | jq -r '.binary_stripped_kb')
          JS_GZ_KB=$(echo "$DATA" | jq -r '.js_gz_kb')
          TOTAL_KB=$(echo "$BINARY_KB + $JS_GZ_KB" | bc)
          make_badge "size" "${TOTAL_KB} KB (binary + JS gzip)" "blue" \
            > .github/badges/total-size.json

          make_badge "build" "$(echo "$DATA" | jq -r '.ssg_ms_per_page') ms/page" "green" \
            > .github/badges/build-speed.json

          # Detailed badges for package READMEs
          make_badge "binary size" "${BINARY_KB} KB" "blue" \
            > .github/badges/binary-size.json

          make_badge "install size" "$(echo "$DATA" | jq -r '.install_kb') KB" "blue" \
            > .github/badges/install-size.json

          make_badge "JS gzip" "${JS_GZ_KB} KB" "blue" \
            > .github/badges/js-gzip.json

      - name: Push badge files to badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan badges-tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp -r .github/badges/* .
          git add *.json
          git commit -m "chore: update benchmark badges"
          git push origin badges-tmp:badges --force
