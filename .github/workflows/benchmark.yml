name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-current:
    name: Benchmark (current)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup

      - name: Run benchmark
        id: bench
        run: bash .github/scripts/benchmark.sh

      - name: Save results
        run: |
          cat <<EOF > /tmp/benchmark-current.json
          {
            "lib_build_s": "${{ steps.bench.outputs.lib_build_s }}",
            "binary_kb": "${{ steps.bench.outputs.binary_kb }}",
            "ssg_build_s": "${{ steps.bench.outputs.ssg_build_s }}",
            "total_size_kb": "${{ steps.bench.outputs.total_size_kb }}",
            "js_kb": "${{ steps.bench.outputs.js_kb }}",
            "js_gz_kb": "${{ steps.bench.outputs.js_gz_kb }}",
            "css_kb": "${{ steps.bench.outputs.css_kb }}",
            "html_kb": "${{ steps.bench.outputs.html_kb }}",
            "pages": "${{ steps.bench.outputs.pages }}"
          }
          EOF

      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-current
          path: /tmp/benchmark-current.json
          retention-days: 1

  benchmark-main:
    name: Benchmark (main)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: ./.github/actions/setup

      - name: Run benchmark
        id: bench
        run: bash .github/scripts/benchmark.sh

      - name: Save results
        run: |
          cat <<EOF > /tmp/benchmark-main.json
          {
            "lib_build_s": "${{ steps.bench.outputs.lib_build_s }}",
            "binary_kb": "${{ steps.bench.outputs.binary_kb }}",
            "ssg_build_s": "${{ steps.bench.outputs.ssg_build_s }}",
            "total_size_kb": "${{ steps.bench.outputs.total_size_kb }}",
            "js_kb": "${{ steps.bench.outputs.js_kb }}",
            "js_gz_kb": "${{ steps.bench.outputs.js_gz_kb }}",
            "css_kb": "${{ steps.bench.outputs.css_kb }}",
            "html_kb": "${{ steps.bench.outputs.html_kb }}",
            "pages": "${{ steps.bench.outputs.pages }}"
          }
          EOF

      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-main
          path: /tmp/benchmark-main.json
          retention-days: 1

  comment:
    name: Post Results
    if: github.event_name == 'pull_request'
    needs: [benchmark-current, benchmark-main]
    runs-on: ubuntu-24.04
    steps:
      - name: Download results
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: results

      - name: Comment on PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('results/benchmark-current/benchmark-current.json', 'utf8'));
            const m = JSON.parse(fs.readFileSync('results/benchmark-main/benchmark-main.json', 'utf8'));

            function delta(cur, base) {
              const diff = parseFloat(cur) - parseFloat(base);
              if (Math.abs(diff) < 0.1) return '';
              const sign = diff > 0 ? '+' : '';
              return ` (${sign}${diff.toFixed(1)})`;
            }

            const marker = '<!-- benchmark-comment -->';
            const body = `${marker}
## Build Benchmark

**DX - Lib Build**

| Metric | main | this PR |
|--------|------|---------|
| Lib build time | ${m.lib_build_s}s | ${c.lib_build_s}s${delta(c.lib_build_s, m.lib_build_s)} |
| LSP binary size | ${m.binary_kb} KB | ${c.binary_kb} KB${delta(c.binary_kb, m.binary_kb)} |

**Performance - Homepage Build**

| Metric | main | this PR |
|--------|------|---------|
| SSG build time (median of 3) | ${m.ssg_build_s}s | ${c.ssg_build_s}s${delta(c.ssg_build_s, m.ssg_build_s)} |
| Pages | ${m.pages} | ${c.pages} |

**Output - Homepage Size**

| Metric | main | this PR |
|--------|------|---------|
| Total output | ${m.total_size_kb} KB | ${c.total_size_kb} KB${delta(c.total_size_kb, m.total_size_kb)} |
| JS bundle | ${m.js_kb} KB (${m.js_gz_kb} gz) | ${c.js_kb} KB (${c.js_gz_kb} gz)${delta(c.js_kb, m.js_kb)} |
| CSS | ${m.css_kb} KB | ${c.css_kb} KB${delta(c.css_kb, m.css_kb)} |
| HTML | ${m.html_kb} KB | ${c.html_kb} KB${delta(c.html_kb, m.html_kb)} |
`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
