name = "typedown-yaml"
grammar = "typedown_yaml"
path_suffixes = ["typedown.yaml", "typedown.yml"]
tab_size = 2
line_comments = ["# "]

brackets = [
  { start = "(", end = ")", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
  { start = "{", end = "}", close = true, newline = true },
]
